<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企業級多工作表廠區配置管理系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- html2canvas -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <!-- SheetJS (Excel) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    .machine-card {
      position: absolute;
      user-select: none;
      touch-action: none;
      transition: box-shadow 0.2s ease;
      width: 150px;
      cursor: pointer;
    }
    .machine-card.dragging {
      opacity: 0.95;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.08);
      z-index: 1000 !important;
      cursor: grabbing !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- 頂部商業導覽列 -->
  <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
    <div class="flex items-center space-x-3">
      <div id="brand-logo-container" onclick="changeLogoUrl()" title="點擊可設定 Logo 圖片連結" class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white text-xl shadow-md shadow-blue-500/20 overflow-hidden cursor-pointer hover:opacity-90 transition">
        <div id="brand-logo-content" class="w-full h-full flex items-center justify-center">
          <i class="fa-solid fa-industry"></i>
        </div>
      </div>
      <div>
        <h1 class="text-lg font-bold text-slate-900 tracking-tight">智慧廠區多工作表配置系統</h1>
        <p class="text-xs text-slate-400">Multi-Sheet Factory Zone Layout Management</p>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-2 text-xs">
        <span id="firebase-status" class="px-3 py-1.5 rounded-full bg-amber-50 text-amber-700 font-medium border border-amber-200 flex items-center gap-1.5">
          <i class="fa-solid fa-circle-notch fa-spin"></i> <span>連線初始化中...</span>
        </span>
        <span id="last-update-time" class="text-slate-400 hidden md:inline">上次更新：尚無</span>
      </div>

      <!-- 中英文切換按鈕 -->
      <button onclick="toggleLanguage()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
        <i class="fa-solid fa-language"></i> <span id="lang-btn-text">English</span>
      </button>

      <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow-sm transition flex items-center gap-1.5">
        <i class="fa-solid fa-file-excel"></i> <span class="i-text" data-zh="匯出 Excel" data-en="Export Excel">匯出 Excel</span>
      </button>
      <label class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow-sm transition cursor-pointer flex items-center gap-1.5">
        <i class="fa-solid fa-file-import"></i> <span class="i-text" data-zh="匯入 Excel" data-en="Import Excel">匯入 Excel</span>
        <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="hidden" onchange="importFromExcel(event)">
      </label>
      <button onclick="exportLayoutPNG()" class="bg-slate-700 hover:bg-slate-800 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow-sm transition flex items-center gap-1.5">
        <i class="fa-solid fa-camera"></i> <span class="i-text" data-zh="截圖匯出" data-en="Export PNG">截圖匯出</span>
      </button>

      <label class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow-sm transition cursor-pointer flex items-center gap-1.5">
        <i class="fa-solid fa-image"></i> <span class="i-text" data-zh="更換當前區底圖" data-en="Change Bg">更換當前區底圖</span>
        <input type="file" id="bg-image-input" accept="image/*" class="hidden" onchange="handleBgImageUpload(event)">
      </label>

      <button id="auth-toggle-btn" onclick="toggleAuthModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-4 py-2 rounded-lg text-xs font-semibold transition">
        管理員登入
      </button>
    </div>
  </header>

  <!-- 工作表 (分區) 頁籤導覽列 -->
  <div class="bg-white border-b border-slate-200 px-8 py-2.5 flex items-center justify-between shadow-sm overflow-x-auto">
    <div id="sheets-tab-container" class="flex items-center space-x-2"></div>
    <div id="sheet-actions-toolbar" class="hidden flex items-center space-x-2">
      <button onclick="addNewSheet()" class="bg-slate-800 hover:bg-slate-900 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
        <i class="fa-solid fa-plus"></i> 新增工作表 (分區)
      </button>
    </div>
  </div>

  <!-- 次要操作工具列 -->
  <div class="bg-slate-100/70 border-b border-slate-200 px-8 py-2 flex items-center justify-between text-xs">
    <div class="text-slate-500 font-medium">
      <span><i class="fa-solid fa-circle-info text-blue-500 mr-1"></i>提示：雙擊頂部的「課別」、「區域」、「材質」文字即可直接更改名稱；雙擊頁籤可重新命名分區。</span>
    </div>
    <div id="admin-toolbar" class="hidden flex items-center space-x-2">
      <button onclick="addNewMachine()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-md text-xs font-semibold shadow-sm transition flex items-center gap-1">
        <i class="fa-solid fa-plus"></i> 在當前工作表新增機台
      </button>
    </div>
  </div>

  <!-- 主畫布區域 -->
  <main class="flex-1 p-6 max-w-[1700px] mx-auto w-full">
    <!-- 標題區域 -->
    <div class="bg-white border border-slate-200 rounded-2xl p-4 mb-4 shadow-sm flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-4 flex-wrap">
        <div class="flex items-center space-x-2 bg-blue-50 border border-blue-200 px-4 py-2 rounded-xl">
          <span class="text-xs font-bold text-blue-800 flex items-center gap-1">
            <i class="fa-solid fa-building-user"></i> <span class="lbl-dept">課別</span>:
          </span>
          <span id="header-department" ondblclick="editFieldDirectly('department')" title="雙擊可直接更改課別" class="text-sm font-extrabold text-blue-900 cursor-pointer hover:bg-blue-100/70 px-1.5 py-0.5 rounded transition">載入中...</span>
        </div>
        
        <div class="flex items-center space-x-2 bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl">
          <span class="text-xs font-semibold text-slate-600 flex items-center gap-1">
            <i class="fa-solid fa-map-location-dot"></i> <span class="lbl-zone">區域</span>:
          </span>
          <span id="header-zone" ondblclick="editFieldDirectly('zone')" title="雙擊可直接更改區域" class="text-xs font-bold text-slate-800 cursor-pointer hover:bg-slate-200/70 px-1.5 py-0.5 rounded transition">載入中...</span>
        </div>

        <div class="flex items-center space-x-2 bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl">
          <span class="text-xs font-semibold text-slate-600 flex items-center gap-1">
            <i class="fa-solid fa-layer-group"></i> <span class="lbl-mat">材質</span>:
          </span>
          <span id="header-material" ondblclick="editFieldDirectly('material')" title="雙擊可直接更改材質" class="text-xs font-bold text-slate-800 cursor-pointer hover:bg-slate-200/70 px-1.5 py-0.5 rounded transition">載入中...</span>
        </div>
      </div>

      <div class="text-xs text-slate-400 flex items-center gap-3">
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-600 inline-block"></span> 運作中</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-sky-400 inline-block"></span> 急單</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span> 待機</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-600 inline-block"></span> 異常</span>
        <span><i class="fa-solid fa-magnet text-indigo-500 ml-2 mr-1"></i>智慧磁吸對齊</span>
      </div>
    </div>

    <!-- 畫布容器 (高度 1400px) -->
    <div id="factory-canvas-container" class="relative rounded-2xl border border-slate-300 bg-white shadow-inner overflow-hidden w-full h-[1400px]">
      <div id="factory-bg-layer" class="absolute inset-0 bg-cover bg-center opacity-85 pointer-events-none"></div>
      <div id="machine-canvas-area" class="absolute inset-0 z-10 w-full h-full"></div>

      <!-- 即時座標浮動提示 -->
      <div id="coordinate-tooltip" style="display: none;" class="absolute bg-slate-900 text-white text-[11px] px-2.5 py-1.5 rounded-lg shadow-xl z-[9999] font-mono tracking-wide border border-slate-700 pointer-events-none whitespace-nowrap">
        <i class="fa-solid fa-location-crosshairs text-blue-400 mr-1"></i>X:<span id="tooltip-x" class="text-emerald-400 font-bold">0</span>, Y:<span id="tooltip-y" class="text-emerald-400 font-bold">0</span>
      </div>
    </div>
  </main>

  <!-- 登入 Modal -->
  <div id="login-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center">
    <div class="bg-white border border-slate-200 p-8 rounded-2xl w-96 shadow-2xl">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-lock text-blue-600"></i> 管理員登入
        </h2>
        <button onclick="closeLoginModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">電子郵件 (Email)</label>
          <input type="email" id="login-email" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm focus:outline-none focus:border-blue-500" placeholder="admin@example.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">密碼 (Password)</label>
          <input type="password" id="login-password" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm focus:outline-none focus:border-blue-500" placeholder="••••••••">
        </div>
        <div id="login-error" class="text-rose-600 text-xs font-medium hidden"></div>
        <div class="flex justify-end space-x-2 pt-2">
          <button onclick="closeLoginModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-xs font-semibold">取消</button>
          <button onclick="handleLogin()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow-sm">確認登入</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 機台編輯 Modal -->
  <div id="edit-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center">
    <div class="bg-white border border-slate-200 p-8 rounded-2xl w-[480px] shadow-2xl">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-gear text-blue-600"></i> 編輯機台資訊
        </h2>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <input type="hidden" id="edit-machine-id">
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">機台名稱 / 編號</label>
          <input type="text" id="edit-name" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">詳細資訊 / 零件編號 (多行可用逗號或換行)</label>
          <textarea id="edit-details" rows="3" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm focus:outline-none focus:border-blue-500" placeholder="例如: 6FO01-00622270"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">運作狀態燈號</label>
          <select id="edit-status-color" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm focus:outline-none focus:border-blue-500">
            <option value="bg-emerald-600">綠色 (運作中)</option>
            <option value="bg-sky-400">藍色 (急單)</option>
            <option value="bg-amber-500">黃色 (待機/維護)</option>
            <option value="bg-rose-600">紅色 (異常/停機)</option>
          </select>
        </div>
        <div class="flex justify-between pt-4 border-t border-slate-100">
          <div class="space-x-2">
            <button onclick="deleteCurrentMachine()" class="bg-rose-50 text-rose-600 hover:bg-rose-100 border border-rose-200 px-3 py-2 rounded-lg text-xs font-semibold transition">刪除此機台</button>
            <button onclick="duplicateCurrentMachine()" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 border border-indigo-200 px-3 py-2 rounded-lg text-xs font-semibold transition">複製此機台</button>
          </div>
          <div class="space-x-2">
            <button onclick="closeEditModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-xs font-semibold">取消</button>
            <button onclick="saveMachineChanges()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow-sm">儲存變更</button>
          </div>
        </div>
      </div>
    </div>
  </div>

    function initCardInteraction(card, machineData) {
      let startX = 0, startY = 0;
      let initialX = 0, initialY = 0;
      let hasMoved = false;

      const tooltip = document.getElementById('coordinate-tooltip');
      const tipX = document.getElementById('tooltip-x');
      const tipY = document.getElementById('tooltip-y');

      let guideLineX = document.getElementById('snap-guideline-x');
      let guideLineY = document.getElementById('snap-guideline-y');
      if (!guideLineX) {
        guideLineX = document.createElement('div');
        guideLineX.id = 'snap-guideline-x';
        guideLineX.style.cssText = 'position:absolute; top:0; bottom:0; width:1px; background:#3b82f6; z-index:999; display:none; pointer-events:none;';
        document.getElementById('factory-canvas-container').appendChild(guideLineX);
      }
      if (!guideLineY) {
        guideLineY = document.createElement('div');
        guideLineY.id = 'snap-guideline-y';
        guideLineY.style.cssText = 'position:absolute; left:0; right:0; height:1px; background:#3b82f6; z-index:999; display:none; pointer-events:none;';
        document.getElementById('factory-canvas-container').appendChild(guideLineY);
      }

      card.onpointerdown = (e) => {
        if (!isEditor) return;
        startX = e.clientX;
        startY = e.clientY;
        initialX = machineData.x || 30;
        initialY = machineData.y || 30;
        hasMoved = false;

        card.setPointerCapture(e.pointerId);

        card.onpointermove = (ev) => {
          const dx = ev.clientX - startX;
          const dy = ev.clientY - startY;

          if (!hasMoved && (Math.abs(dx) > 2 || Math.abs(dy) > 2)) {
            hasMoved = true;
            card.classList.add('dragging');
            tooltip.style.display = 'block';
          }

          if (hasMoved) {
            let newX = initialX + dx;
            let newY = initialY + dy;

            const currentSheet = getCurrentSheet();
            const snapThreshold = 6;
            let snappedX = false;
            let snappedY = false;

            currentSheet.machines.forEach(other => {
              if (other.id === machineData.id) return;
              if (Math.abs(newX - other.x) < snapThreshold) {
                newX = other.x;
                snappedX = true;
                guideLineX.style.left = `${newX + card.offsetWidth / 2}px`;
                guideLineX.style.display = 'block';
              }
              if (Math.abs(newY - other.y) < snapThreshold) {
                newY = other.y;
                snappedY = true;
                guideLineY.style.top = `${newY + card.offsetHeight / 2}px`;
                guideLineY.style.display = 'block';
              }
            });

            if (!snappedX) guideLineX.style.display = 'none';
            if (!snappedY) guideLineY.style.display = 'none';

            const container = document.getElementById('factory-canvas-container');
            const maxX = Math.max(0, container.clientWidth - card.offsetWidth);
            const maxY = Math.max(0, container.clientHeight - card.offsetHeight);

            newX = Math.max(10, Math.min(newX, maxX));
            newY = Math.max(10, Math.min(newY, maxY));

            machineData.x = Math.round(newX);
            machineData.y = Math.round(newY);
            card.style.left = `${newX}px`;
            card.style.top = `${newY}px`;

            tipX.textContent = Math.round(newX);
            tipY.textContent = Math.round(newY);

            tooltip.style.left = `${newX + card.offsetWidth + 8}px`;
            tooltip.style.top = `${newY}px`;
          }
        };

        card.onpointerup = (ev) => {
          if (guideLineX) guideLineX.style.display = 'none';
          if (guideLineY) guideLineY.style.display = 'none';
          tooltip.style.display = 'none';

          try { card.releasePointerCapture(ev.pointerId); } catch(err) {}

          card.onpointermove = null;
          card.onpointerup = null;
          card.classList.remove('dragging');

          if (!hasMoved) {
            openEditModal(machineData.id);
          } else {
            syncToFirebase();
          }
        };
      };
    }

    function exportToExcel() {
      try {
        if (typeof XLSX === 'undefined') {
          alert("Excel 匯出工具尚未載入完成。");
          return;
        }

        const workbook = XLSX.utils.book_new();
        if (!appState.sheets || appState.sheets.length === 0) {
          alert("目前沒有任何工作表可供匯出！");
          return;
        }

        appState.sheets.forEach(sheet => {
          let rows = [];
          if (sheet.machines && sheet.machines.length > 0) {
            rows = sheet.machines.map(m => ({
              "課別": sheet.department || sheet.name,
              "區域": sheet.zone || "",
              "材質": sheet.material || "",
              "機台編號": m.name || "",
              "詳細工單資訊": m.details || "",
              "狀態顏色": m.statusColor || "bg-emerald-600",
              "X座標": m.x || 0,
              "Y座標": m.y || 0
            }));
          } else {
            rows = [{ "課別": sheet.department || sheet.name, "區域": sheet.zone || "", "材質": sheet.material || "", "機台編號": "", "詳細工單資訊": "", "狀態顏色": "", "X座標": 0, "Y座標": 0 }];
          }

          const ws = XLSX.utils.json_to_sheet(rows);
          XLSX.utils.book_append_sheet(workbook, ws, sheet.name || "未命名工作表");
        });

        XLSX.writeFile(workbook, `廠區完整機台配置_${new Date().toISOString().slice(0,10)}.xlsx`);
      } catch (err) {
        console.error("匯出 Excel 發生錯誤：", err);
        alert("匯出 Excel 失敗。");
      }
    }

    function importFromExcel(event) {
      if (!isEditor) return alert("請先登入管理員帳號！");
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          appState.sheets = workbook.SheetNames.map((sheetName, sIdx) => {
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
            let firstRow = rows[0] || {};
            return {
              id: `sheet_imp_${sIdx}_${Date.now()}`,
              name: firstRow["課別"] || sheetName,
              department: firstRow["課別"] || sheetName,
              zone: firstRow["區域"] || "預設區域",
              material: firstRow["材質"] || "通用材質",
              bgImage: "",
              machines: rows.map((row, mIdx) => ({
                id: `m_${sIdx}_${mIdx}_${Date.now()}`,
                name: row["機台編號"] || `機台_${mIdx + 1}`,
                details: row["詳細工單資訊"] || "",
                statusColor: row["狀態顏色"] || "bg-emerald-600",
                x: Number(row["X座標"]) || (30 + (mIdx % 5) * 200),
                y: Number(row["Y座標"]) || (30 + Math.floor(mIdx / 5) * 100)
              }))
            };
          });
          if (appState.sheets.length > 0) appState.activeSheetId = appState.sheets[0].id;
          syncToFirebase();
          renderApp();
          alert("Excel 資料成功匯入！");
        } catch (err) { alert("解析 Excel 失敗。"); }
        event.target.value = "";
      };
      reader.readAsArrayBuffer(file);
    }

      if (!isEditor) return;
      const id = document.getElementById('edit-machine-id').value;
      const m = getCurrentSheet().machines.find(item => item.id === id);
      if (m) {
        m.name = document.getElementById('edit-name').value;
        m.details = document.getElementById('edit-details').value;
        m.statusColor = document.getElementById('edit-status-color').value;
        syncToFirebase();
        renderApp();
        closeEditModal();
      }
    }

    function duplicateCurrentMachine() {
      if (!isEditor) return;
      const currentSheet = getCurrentSheet();
      const id = document.getElementById('edit-machine-id').value;
      const target = currentSheet.machines.find(item => item.id === id);
      if (!target) return;

      const newMachine = {
        id: `m_${Date.now()}`,
        name: target.name + "(複)",
        details: target.details,
        statusColor: target.statusColor,
        x: (target.x || 30) + 30,
        y: (target.y || 30) + 30
      };

      currentSheet.machines.push(newMachine);
      syncToFirebase();
      renderApp();
      closeEditModal();
    }

    function deleteCurrentMachine() {
      if (!isEditor) return;
      if (confirm("確定刪除此機台？")) {
        const currentSheet = getCurrentSheet();
        const id = document.getElementById('edit-machine-id').value;
        currentSheet.machines = currentSheet.machines.filter(item => item.id !== id);
        syncToFirebase();
        renderApp();
        closeEditModal();
      }
    }
  </script>
</body>
</html>
