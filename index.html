<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企業級多工作表廠區配置管理系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- html2canvas -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <!-- SheetJS (Excel) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    .machine-card {
      position: absolute;
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition: box-shadow 0.2s ease;
      width: 140px; /* 1/4 大小 */
    }
    .machine-card:active {
      cursor: grabbing;
    }
    .machine-card.dragging {
      opacity: 0.85;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      z-index: 1000 !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- 頂部商業導覽列 -->
  <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white text-xl shadow-md shadow-blue-500/20">
        <i class="fa-solid fa-industry"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold text-slate-900 tracking-tight">智慧廠區多工作表配置系統</h1>
        <p class="text-xs text-slate-400">Multi-Sheet Factory Zone Layout Management</p>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <!-- 雲端連線狀態與更新時間顯示 -->
      <div class="flex items-center space-x-2 text-xs">
        <span id="firebase-status" class="px-3 py-1.5 rounded-full bg-amber-50 text-amber-700 font-medium border border-amber-200 flex items-center gap-1.5">
          <i class="fa-solid fa-circle-notch fa-spin"></i> <span>連線初始化中...</span>
        </span>
        <span id="last-update-time" class="text-slate-400 hidden md:inline">上次更新：尚無</span>
      </div>

      <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow-sm transition flex items-center gap-1.5">
        <i class="fa-solid fa-file-excel"></i> 匯出 Excel
      </button>
      <label class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow-sm transition cursor-pointer flex items-center gap-1.5">
        <i class="fa-solid fa-file-import"></i> 匯入 Excel
        <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="hidden" onchange="importFromExcel(event)">
      </label>
      <button onclick="exportLayoutPNG()" class="bg-slate-700 hover:bg-slate-800 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow-sm transition flex items-center gap-1.5">
        <i class="fa-solid fa-camera"></i> 截圖匯出
      </button>

      <label class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow-sm transition cursor-pointer flex items-center gap-1.5">
        <i class="fa-solid fa-image"></i> 更換當前區底圖
        <input type="file" id="bg-image-input" accept="image/*" class="hidden" onchange="handleBgImageUpload(event)">
      </label>

      <button id="auth-toggle-btn" onclick="toggleAuthModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-4 py-2 rounded-lg text-xs font-semibold transition">
        管理員登入
      </button>
    </div>
  </header>

  <!-- 工作表 (分區) 頁籤導覽列 -->
  <div class="bg-white border-b border-slate-200 px-8 py-2 flex items-center justify-between shadow-2xs overflow-x-auto">
    <div id="sheets-tab-container" class="flex items-center space-x-2"></div>
    <div id="sheet-actions-toolbar" class="hidden flex items-center space-x-2">
      <button onclick="addNewSheet()" class="bg-slate-800 hover:bg-slate-900 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
        <i class="fa-solid fa-plus"></i> 新增工作表 (分區)
      </button>
    </div>
  </div>

  <!-- 次要操作工具列 -->
  <div class="bg-slate-100/70 border-b border-slate-200 px-8 py-2 flex items-center justify-between text-xs">
    <div class="text-slate-500 font-medium">
      <span><i class="fa-solid fa-circle-info text-blue-500 mr-1"></i>雙擊卡片可編輯資訊，登入後新增或拖曳機台將即時寫入並安全同步至雲端。</span>
    </div>
    <div id="admin-toolbar" class="hidden flex items-center space-x-2">
      <button onclick="addNewMachine()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-md text-xs font-semibold shadow-2xs transition flex items-center gap-1">
        <i class="fa-solid fa-plus"></i> 在當前工作表新增機台
      </button>
    </div>
  </div>

  <!-- 主畫布區域 -->
  <main class="flex-1 p-6 max-w-[1700px] mx-auto w-full">
    <div id="factory-canvas-container" class="relative rounded-2xl border border-slate-300 bg-white shadow-inner overflow-hidden w-full h-[730px]">
      <div id="factory-bg-layer" class="absolute inset-0 bg-cover bg-center opacity-85 pointer-events-none"></div>
      <div id="machine-canvas-area" class="absolute inset-0 z-10 w-full h-full pointer-events-none"></div>
    </div>
  </main>

  <!-- 登入 Modal -->
  <div id="login-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center">
    <div class="bg-white border border-slate-200 p-8 rounded-2xl w-96 shadow-2xl">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-lock text-blue-600"></i> 管理員登入
        </h2>
        <button onclick="closeLoginModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">電子郵件 (Email)</label>
          <input type="email" id="login-email" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm focus:outline-none focus:border-blue-500" placeholder="admin@example.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">密碼 (Password)</label>
          <input type="password" id="login-password" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm focus:outline-none focus:border-blue-500" placeholder="••••••••">
        </div>
        <div id="login-error" class="text-rose-600 text-xs font-medium hidden"></div>
        <div class="flex justify-end space-x-2 pt-2">
          <button onclick="closeLoginModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-xs font-semibold">取消</button>
          <button onclick="handleLogin()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow-sm">確認登入</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 機台編輯 Modal -->
  <div id="edit-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center">
    <div class="bg-white border border-slate-200 p-8 rounded-2xl w-[480px] shadow-2xl">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-gear text-blue-600"></i> 編輯機台資訊
        </h2>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <input type="hidden" id="edit-machine-id">
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">機台名稱 / 編號</label>
          <input type="text" id="edit-name" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">專屬客戶名稱</label>
          <input type="text" id="edit-customer" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm focus:outline-none focus:border-blue-500" placeholder="例如：Varian / Applied">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">機台專屬圖片網址 (URL)</label>
          <input type="text" id="edit-img-url" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm focus:outline-none focus:border-blue-500" placeholder="https://example.com/machine.jpg">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">下方備註說明</label>
          <textarea id="edit-note" rows="2" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm focus:outline-none focus:border-blue-500" placeholder="輸入維護或交期備註..."></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">運作狀態燈號</label>
          <select id="edit-status-color" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-slate-900 text-sm focus:outline-none focus:border-blue-500">
            <option value="bg-emerald-600">綠色 (運作中)</option>
            <option value="bg-amber-500">黃色 (待機/維護)</option>
            <option value="bg-rose-600">紅色 (異常/停機)</option>
          </select>
        </div>
        <div class="flex justify-between pt-4">
          <button onclick="deleteCurrentMachine()" class="bg-rose-50 text-rose-600 hover:bg-rose-100 border border-rose-200 px-4 py-2 rounded-lg text-xs font-semibold transition">刪除此機台</button>
          <div class="space-x-2">
            <button onclick="closeEditModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-xs font-semibold">取消</button>
            <button onclick="saveMachineChanges()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow-sm">儲存變更</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    // ==========================================
    // 1. Firebase 專案設定
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyC9V1qeIXdQXP0-O4aWFehgPnbAMDVcQbU",
      authDomain: "machinecustomerconfig-dbbf9.firebaseapp.com",
      projectId: "machinecustomerconfig-dbbf9",
      storageBucket: "machinecustomerconfig-dbbf9.firebasestorage.app",
      messagingSenderId: "541137205848",
      appId: "1:541137205848:web:9b9701cf12147cb5eda82d",
      measurementId: "G-VJQ6R2DW7M"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let appState = {
      activeSheetId: "sheet_auto",
      updatedAt: null,
      sheets: [
        {
          id: "sheet_auto",
          name: "自動化區",
          bgImage: "",
          machines: [
            { id: "m_1", name: "CM77 (銑床)", customer: "Varian", imgUrl: "", note: "運作正常", statusColor: "bg-emerald-600", x: 30, y: 30 },
            { id: "m_2", name: "CM76 (銑床)", customer: "Applied", imgUrl: "", note: "待命保養", statusColor: "bg-amber-500", x: 190, y: 30 }
          ]
        },
        {
          id: "sheet_yong",
          name: "永進區",
          bgImage: "",
          machines: [
            { id: "m_3", name: "AM05 (銑床)", customer: "市場件", imgUrl: "", note: "急單趕工", statusColor: "bg-emerald-600", x: 30, y: 30 }
          ]
        }
      ]
    };

    let isEditor = false;
    let isLocallyUpdating = false; // 防止本機寫入時被遠端監聽覆蓋

    // ==========================================
    // 2. 認證監聽
    // ==========================================
    auth.onAuthStateChanged(user => {
      const authBtn = document.getElementById('auth-toggle-btn');
      const adminToolbar = document.getElementById('admin-toolbar');
      const sheetActionsToolbar = document.getElementById('sheet-actions-toolbar');

      if (user) {
        isEditor = true;
        authBtn.textContent = "登出系統";
        authBtn.className = "bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-4 py-2 rounded-lg text-xs font-semibold transition";
        adminToolbar.classList.remove('hidden');
        sheetActionsToolbar.classList.remove('hidden');
      } else {
        isEditor = false;
        authBtn.textContent = "管理員登入";
        authBtn.className = "bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-4 py-2 rounded-lg text-xs font-semibold transition";
        adminToolbar.classList.add('hidden');
        sheetActionsToolbar.classList.add('hidden');
      }
      renderApp();
    });

    function toggleAuthModal() {
      if (isEditor) {
        auth.signOut().then(() => alert("已成功登出"));
      } else {
        document.getElementById('login-modal').classList.remove('hidden');
      }
    }
    function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); }
    
    function handleLogin() {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      auth.signInWithEmailAndPassword(email, pass)
        .then(() => { 
          closeLoginModal(); 
          alert("登入成功！"); 
        })
        .catch(err => {
          const errEl = document.getElementById('login-error');
          errEl.textContent = "登入失敗：" + err.message;
          errEl.classList.remove('hidden');
        });
    }

    // ==========================================
    // 3. 雲端同步 (加入鎖定機制防覆蓋)
    // ==========================================
    const stateRef = db.ref('factory_layout_commercial_v7');

    function syncToFirebase() {
      if (!isEditor) return;
      isLocallyUpdating = true;
      appState.updatedAt = new Date().toISOString();
      stateRef.set(appState).then(() => {
        setTimeout(() => { isLocallyUpdating = false; }, 300);
      }).catch(err => {
        isLocallyUpdating = false;
        console.error("同步失敗:", err);
      });
    }

    db.ref('.info/connected').on('value', snap => {
      const statusEl = document.getElementById('firebase-status');
      if (snap.val() === true) {
        statusEl.className = "px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700 font-medium border border-emerald-200 flex items-center gap-1.5";
        statusEl.innerHTML = `<i class="fa-solid fa-circle text-[9px] text-emerald-500"></i> <span>雲端已連線</span>`;
      } else {
        statusEl.className = "px-3 py-1.5 rounded-full bg-rose-50 text-rose-700 font-medium border border-rose-200 flex items-center gap-1.5";
        statusEl.innerHTML = `<i class="fa-solid fa-circle text-[9px] text-rose-500"></i> <span>雲端斷線中</span>`;
      }
    });

    stateRef.on('value', snapshot => {
      if (isLocallyUpdating) return; // 略過本機剛發出的寫入回呼
      const val = snapshot.val();
      if (val) {
        appState = val;
        renderApp();
        updateTimeDisplay();
      }
    });

    function updateTimeDisplay() {
      const timeEl = document.getElementById('last-update-time');
      if (appState.updatedAt) {
        const dateObj = new Date(appState.updatedAt);
        timeEl.textContent = `上次更新：${dateObj.toLocaleString('zh-TW', { hour12: false })}`;
      } else {
        timeEl.textContent = `上次更新：尚未同步`;
      }
    }

    // ==========================================
    // 4. 渲染核心
    // ==========================================
    function getCurrentSheet() {
      let sheet = appState.sheets.find(s => s.id === appState.activeSheetId);
      if (!sheet && appState.sheets.length > 0) {
        sheet = appState.sheets[0];
        appState.activeSheetId = sheet.id;
      }
      return sheet;
    }

    function renderApp() {
      renderSheetsTabs();
      updateTimeDisplay();

      const currentSheet = getCurrentSheet();
      if (!currentSheet) return;

      const bgLayer = document.getElementById('factory-bg-layer');
      bgLayer.style.backgroundImage = currentSheet.bgImage ? `url('${currentSheet.bgImage}')` : 'none';

      const canvasArea = document.getElementById('machine-canvas-area');
      canvasArea.innerHTML = "";

      currentSheet.machines.forEach(m => {
        const card = document.createElement('div');
        card.className = `machine-card bg-white border border-slate-200 rounded-xl p-2.5 shadow-md flex flex-col space-y-1.5 transition-shadow hover:shadow-lg ${isEditor ? 'pointer-events-auto cursor-grab' : 'pointer-events-none'}`;
        card.style.left = `${m.x || 30}px`;
        card.style.top = `${m.y || 30}px`;

        let imgHtml = `<div class="w-full h-14 bg-slate-100 rounded-md flex items-center justify-center text-slate-400 border border-dashed border-slate-200"><i class="fa-solid fa-microchip text-base"></i></div>`;
        if (m.imgUrl && m.imgUrl.trim() !== "") {
          imgHtml = `<div class="w-full h-14 bg-slate-100 rounded-md overflow-hidden border border-slate-200"><img src="${m.imgUrl}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<div class=\'w-full h-full flex items-center justify-center text-rose-500 text-[10px]\'>網址失效</div>'"></div>`;
        }

        card.innerHTML = `
          <div class="flex justify-between items-center pointer-events-none">
            <span class="font-bold text-slate-900 text-[11px] tracking-tight truncate max-w-[75px]">${m.name}</span>
            <span class="text-[9px] px-1.5 py-0.5 rounded-full font-semibold text-white shadow-2xs ${m.statusColor || 'bg-emerald-600'} truncate max-w-[50px]">${m.customer || '客戶'}</span>
          </div>
          ${imgHtml}
          <div class="text-[10px] bg-slate-50 p-1.5 rounded-md border border-slate-200 text-slate-600 leading-tight pointer-events-none">
            <span class="text-slate-400 font-semibold mb-0.5 block">備註：${m.note || '無'}</span>
          </div>
        `;

        // 雙擊開啟編輯
        card.ondblclick = (e) => {
          e.stopPropagation();
          if (isEditor) openEditModal(m.id);
        };

        if (isEditor) initDragAndDrop(card, m);
        canvasArea.appendChild(card);
      });
    }

    function renderSheetsTabs() {
      const container = document.getElementById('sheets-tab-container');
      container.innerHTML = "";

      appState.sheets.forEach(s => {
        const isActive = s.id === appState.activeSheetId;
        const tab = document.createElement('div');
        tab.className = `flex items-center space-x-2 px-4 py-2 rounded-lg text-xs font-semibold cursor-pointer transition border ${isActive ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'}`;
        
        tab.innerHTML = `
          <i class="fa-solid fa-table-cells text-[11px]"></i>
          <span>${s.name}</span>
          ${(isEditor && appState.sheets.length > 1) ? `<i class="fa-solid fa-xmark ml-1.5 p-1 rounded hover:bg-black/10" onclick="event.stopPropagation(); deleteSheet('${s.id}')"></i>` : ''}
        `;

        tab.ondblclick = () => { if (isEditor) renameSheet(s.id); };
        tab.onclick = () => {
          appState.activeSheetId = s.id;
          renderApp();
        };

        container.appendChild(tab);
      });
    }

    function addNewSheet() {
      if (!isEditor) return;
      const sheetName = prompt("請輸入新工作表 (分區) 名稱：", `分區_${appState.sheets.length + 1}`);
      if (!sheetName) return;

      const newSheet = {
        id: `sheet_${Date.now()}`,
        name: sheetName.trim(),
        bgImage: "",
        machines: []
      };

      appState.sheets.push(newSheet);
      appState.activeSheetId = newSheet.id;
      syncToFirebase();
      renderApp();
    }

    function renameSheet(sheetId) {
      if (!isEditor) return;
      const sheet = appState.sheets.find(s => s.id === sheetId);
      if (!sheet) return;
      const newName = prompt("修改工作表名稱：", sheet.name);
      if (newName && newName.trim() !== "") {
        sheet.name = newName.trim();
        syncToFirebase();
        renderApp();
      }
    }

    function deleteSheet(sheetId) {
      if (!isEditor) return;
      if (appState.sheets.length <= 1) { alert("至少需要保留一個工作表！"); return; }
      if (confirm("確定要刪除此工作表及其中所有機台配置嗎？")) {
        appState.sheets = appState.sheets.filter(s => s.id !== sheetId);
        appState.activeSheetId = appState.sheets[0].id;
        syncToFirebase();
        renderApp();
      }
    }

    // 拖曳限制在畫布隱藏格線內部，不跑版
    function initDragAndDrop(card, machineData) {
      let startX, startY, initialX, initialY;
      card.onpointerdown = (e) => {
        if (!isEditor) return;
        startX = e.clientX; startY = e.clientY;
        initialX = machineData.x || 30; initialY = machineData.y || 30;
        card.classList.add('dragging', 'is-dragging');
        card.setPointerCapture(e.pointerId);

        card.onpointermove = (ev) => {
          let newX = initialX + (ev.clientX - startX);
          let newY = initialY + (ev.clientY - startY);
          
          const container = document.getElementById('factory-canvas-container');
          const maxX = Math.max(0, container.clientWidth - 150);
          const maxY = Math.max(0, container.clientHeight - 150);

          newX = Math.max(10, Math.min(newX, maxX));
          newY = Math.max(10, Math.min(newY, maxY));

          machineData.x = newX; 
          machineData.y = newY;
          card.style.left = `${newX}px`; 
          card.style.top = `${newY}px`;
        };

        card.onpointerup = (ev) => {
          card.releasePointerCapture(ev.pointerId);
          card.onpointermove = null; card.onpointerup = null;
          card.classList.remove('dragging');
          setTimeout(() => card.classList.remove('is-dragging'), 50);
          syncToFirebase();
        };
      };
    }

    // Excel 匯入/匯出
    function exportToExcel() {
      const workbook = XLSX.utils.book_new();
      appState.sheets.forEach(sheet => {
        const rows = sheet.machines.map(m => ({
          "機台編號": m.name, "專屬客戶": m.customer, "圖片網址": m.imgUrl,
          "備註說明": m.note, "狀態顏色": m.statusColor, "X座標": m.x, "Y座標": m.y
        }));
        const ws = XLSX.utils.json_to_sheet(rows.length > 0 ? rows : [{ "機台編號": "", "專屬客戶": "", "圖片網址": "", "備註說明": "", "狀態顏色": "", "X座標": 0, "Y座標": 0 }]);
        XLSX.utils.book_append_sheet(workbook, ws, sheet.name);
      });
      XLSX.writeFile(workbook, `多工作表廠區配置_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    function importFromExcel(event) {
      if (!isEditor) return alert("請先登入管理員帳號！");
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          appState.sheets = workbook.SheetNames.map((sheetName, sIdx) => {
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
            return {
              id: `sheet_imp_${sIdx}_${Date.now()}`,
              name: sheetName,
              bgImage: "",
              machines: rows.map((row, mIdx) => ({
                id: `m_${sIdx}_${mIdx}_${Date.now()}`,
                name: row["機台編號"] || `機台_${mIdx + 1}`,
                customer: row["專屬客戶"] || "未指定",
                imgUrl: row["圖片網址"] || "",
                note: row["備註說明"] || "",
                statusColor: row["狀態顏色"] || "bg-emerald-600",
                x: Number(row["X座標"]) || (30 + (mIdx % 6) * 160),
                y: Number(row["Y座標"]) || (30 + Math.floor(mIdx / 6) * 160)
              }))
            };
          });
          if (appState.sheets.length > 0) appState.activeSheetId = appState.sheets[0].id;
          syncToFirebase();
          renderApp();
          alert("Excel 資料成功匯入！");
        } catch (err) { alert("解析 Excel 失敗。"); }
        event.target.value = "";
      };
      reader.readAsArrayBuffer(file);
    }

    function handleBgImageUpload(event) {
      if (!isEditor) return alert("請先登入！");
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        getCurrentSheet().bgImage = e.target.result;
        syncToFirebase();
        renderApp();
        alert("當前分區底圖上傳成功！");
      };
      reader.readAsDataURL(file);
    }

    function exportLayoutPNG() {
      const container = document.getElementById('factory-canvas-container');
      html2canvas(container, { useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
        const link = document.createElement('a');
        link.download = `廠區配置圖_${getCurrentSheet().name}_${new Date().toISOString().slice(0,10)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    function addNewMachine() {
      if (!isEditor) return;
      const currentSheet = getCurrentSheet();
      currentSheet.machines.push({
        id: `m_${Date.now()}`, 
        name: "新機台", 
        customer: "指定客戶",
        imgUrl: "", 
        note: "備註說明", 
        statusColor: "bg-emerald-600", 
        x: 30, 
        y: 30
      });
      syncToFirebase();
      renderApp();
    }

    function openEditModal(machineId) {
      if (!isEditor) return;
      const m = getCurrentSheet().machines.find(item => item.id === machineId);
      if (!m) return;
      document.getElementById('edit-machine-id').value = m.id;
      document.getElementById('edit-name').value = m.name;
      document.getElementById('edit-customer').value = m.customer || "";
      document.getElementById('edit-img-url').value = m.imgUrl || "";
      document.getElementById('edit-note').value = m.note || "";
      document.getElementById('edit-status-color').value = m.statusColor || "bg-emerald-600";
      document.getElementById('edit-modal').classList.remove('hidden');
    }
    function closeEditModal() { document.getElementById('edit-modal').classList.add('hidden'); }

    function saveMachineChanges() {
      if (!isEditor) return;
      const id = document.getElementById('edit-machine-id').value;
      const m = getCurrentSheet().machines.find(item => item.id === id);
      if (m) {
        m.name = document.getElementById('edit-name').value;
        m.customer = document.getElementById('edit-customer').value;
        m.imgUrl = document.getElementById('edit-img-url').value;
        m.note = document.getElementById('edit-note').value;
        m.statusColor = document.getElementById('edit-status-color').value;
        syncToFirebase();
        renderApp();
        closeEditModal();
      }
    }

    function deleteCurrentMachine() {
      if (!isEditor) return;
      if (confirm("確定刪除此機台？")) {
        const currentSheet = getCurrentSheet();
        const id = document.getElementById('edit-machine-id').value;
        currentSheet.machines = currentSheet.machines.filter(item => item.id !== id);
        syncToFirebase();
        renderApp();
        closeEditModal();
      }
    }
  </script>
</body>
</html>
